# Replacement for /etc/nginx/sites-enabled/mostafa-portfolio on the VPS.
# Written for nginx 1.24. Certificate paths and Certbot includes are unchanged
# from the current file.
#
# What changes compared to the current file:
#   - http://www.mostafaabbas.dev had no server block on port 80 and returned an
#     empty reply; both names now redirect to https://www.mostafaabbas.dev.
#   - https://mostafaabbas.dev served a duplicate copy of the site; it now
#     redirects to www, the canonical host used in every canonical tag.
#   - CSS, JS, JSON and SVG are gzipped (only HTML was compressed before).
#   - "/about/" redirects to "/about" with a 301 instead of the app's 307.
#   - The API accepts uploads up to 12 MB (nginx's 1 MB default rejected larger
#     admin uploads with 413; the API itself allows 10 MB).
#   - HTTP/2 and basic security headers are enabled.

# ============================================================
# MAIN WEBSITE - HTTP -> HTTPS (both names go to www)
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name mostafaabbas.dev www.mostafaabbas.dev;

    return 301 https://www.mostafaabbas.dev$request_uri;
}


# ============================================================
# BARE DOMAIN - HTTPS -> www
# ============================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mostafaabbas.dev;
    ssl_certificate /etc/letsencrypt/live/mostafaabbas.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mostafaabbas.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.mostafaabbas.dev$request_uri;
}


# ============================================================
# MAIN WEBSITE - HTTPS
# ============================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.mostafaabbas.dev;
    ssl_certificate /etc/letsencrypt/live/mostafaabbas.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mostafaabbas.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API through main domain:
    # https://www.mostafaabbas.dev/api/*
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
    }

    # Favicon from client/public. Built files under /assets already get a
    # one-year immutable Cache-Control from the Node server.
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3001;
        expires 7d;
    }

    # Frontend
    location / {
        # "/about/" -> "/about" (the query string is kept)
        rewrite ^/(.+)/$ /$1 permanent;
        proxy_pass http://127.0.0.1:3001;
    }
}


# ============================================================
# API SUBDOMAIN - HTTPS
# ============================================================

server {
    listen 443 ssl http2; # managed by Certbot
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot

    server_name api.mostafaabbas.dev;
    ssl_certificate /etc/letsencrypt/live/api.mostafaabbas.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.mostafaabbas.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # The admin uploads images and the resume PDF here (the API allows 10 MB).
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/plain image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ============================================================
# API SUBDOMAIN - HTTP -> HTTPS
# ============================================================

server {
    listen 80;
    listen [::]:80;

    server_name api.mostafaabbas.dev;

    return 301 https://api.mostafaabbas.dev$request_uri;
}
